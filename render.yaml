services:
  - type: web
    name: student-erp-api
    runtime: node
    repo: https://github.com/theoptiplexcoder/student_erp
    rootDir: apps/api
    plan: free
    buildCommand: HUSKY=0 CI=true NODE_ENV=development pnpm install --frozen-lockfile --filter @student-erp/api... && pnpm run build
    startCommand: node dist/main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://student-erp-web.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
